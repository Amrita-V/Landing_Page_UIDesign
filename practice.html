<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			.container {
				display: flex;
				flex-direction: column-reverse;
			}
			.box-1 {
				height: 100px;
				width: 100px;
				border: 2px solid red;
			}

			.box-2 {
				height: 100px;
				width: 100px;
				border: 2px solid green;
			}
			.box-3 {
				height: 100px;
				width: 100px;
				border: 2px solid blue;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="box-1"></div>
			<div class="box-2"></div>
			<div class="box-3"></div>
		</div>
	</body>
</html>
